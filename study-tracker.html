<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Study Tracker</title>
<style>
:root {
  --bg:       #0f1117;
  --bg2:      #161b22;
  --bg3:      #1c2333;
  --bg4:      #243044;
  --border:   #2a3a4a;
  --border2:  #3a5068;
  --green:        #3dd68c;
  --green-dim:    #1a7a4a;
  --green-bg:     rgba(61,214,140,0.08);
  --amber:        #f0b429;
  --amber-dim:    #8a6200;
  --amber-bg:     rgba(240,180,41,0.08);
  --red:          #ff6b6b;
  --red-dim:      #8b2020;
  --red-bg:       rgba(255,107,107,0.08);
  --blue:         #79c0ff;
  --text:     #e6edf3;
  --text2:    #b0bec5;
  --text3:    #607080;
  --mono: 'Fira Code','Cascadia Code','Consolas','Monaco',monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:var(--bg)}
body{font-family:var(--mono);font-size:13px;color:var(--text);display:flex;justify-content:center;align-items:flex-start;min-height:100vh}

.app-wrap{
  width:100%;
  max-width:420px;
  min-width:300px;
  min-height:100vh;
  display:flex;
  flex-direction:column;
  background:var(--bg);
  border-left:1px solid var(--border);
  border-right:1px solid var(--border);
}

/* titlebar */
.titlebar{
  display:flex;align-items:center;gap:10px;
  padding:8px 14px;
  background:var(--bg2);
  border-bottom:1px solid var(--border);
  flex-shrink:0;
}
.dots{display:flex;gap:5px}
.dot{width:11px;height:11px;border-radius:50%}
.dot-r{background:#ff5f57}.dot-y{background:#febc2e}.dot-g{background:#28c840}
.title-text{flex:1;text-align:center;color:var(--text3);font-size:11px;letter-spacing:1px}
.clock{color:var(--text3);font-size:11px;min-width:70px;text-align:right}

/* sidebar toggle */
.sidebar-toggle{
  display:flex;align-items:center;justify-content:space-between;
  padding:8px 14px;
  background:var(--bg2);
  border-bottom:1px solid var(--border);
  cursor:pointer;
  user-select:none;
  flex-shrink:0;
}
.sidebar-toggle:hover{background:var(--bg3)}
.sidebar-toggle-left{display:flex;align-items:center;gap:8px}
.sidebar-toggle-label{font-size:11px;letter-spacing:1.5px;color:var(--green);text-transform:uppercase}
.sidebar-toggle-arrow{font-size:10px;color:var(--text3);transition:transform 0.2s}
.sidebar-toggle-arrow.open{transform:rotate(90deg)}
.sidebar-add{padding:3px 7px;font-size:11px;border:1px solid var(--border2);border-radius:3px;background:none;color:var(--text3);cursor:pointer;font-family:var(--mono)}
.sidebar-add:hover{color:var(--green);border-color:var(--green-dim)}

/* sidebar */
.sidebar{
  background:var(--bg2);
  border-bottom:1px solid var(--border);
  overflow:hidden;
  transition:max-height 0.25s ease;
  max-height:0;
}
.sidebar.open{max-height:40vh;overflow-y:auto}
.sidebar::-webkit-scrollbar{width:3px}
.sidebar::-webkit-scrollbar-thumb{background:var(--border2);border-radius:2px}
.sidebar-inner{padding:6px 10px 10px}

.cat-block{margin-bottom:2px}
.cat-row{display:flex;align-items:center;gap:5px;padding:5px 8px;border-radius:3px;cursor:pointer;user-select:none;border:1px solid transparent}
.cat-row:hover{background:var(--bg3);border-color:var(--border)}
.cat-chevron{color:var(--text3);font-size:9px;width:12px;flex-shrink:0;transition:transform 0.15s;display:inline-block}
.cat-chevron.open{transform:rotate(90deg)}
.cat-name{flex:1;color:var(--amber);font-size:12px;font-weight:600}
.cat-total{font-size:10px;color:var(--text3);margin-right:4px}
.cat-actions{display:none;gap:2px}
.cat-row:hover .cat-actions{display:flex}
.del-btn{background:none;border:none;cursor:pointer;color:var(--text3);font-size:11px;padding:1px 4px;border-radius:2px;font-family:var(--mono);line-height:1}
.del-btn:hover{color:var(--red)}
.arc-btn{background:none;border:none;cursor:pointer;color:var(--text3);font-size:11px;padding:1px 4px;border-radius:2px;font-family:var(--mono);line-height:1}
.arc-btn:hover{color:var(--amber)}

.tasks-list{margin-left:16px;border-left:1px solid var(--border);padding-left:8px;margin-bottom:2px}
.task-row{display:flex;align-items:center;gap:5px;padding:4px 6px;border-radius:3px;cursor:pointer;user-select:none;border:1px solid transparent}
.task-row:hover{background:var(--bg3)}
.task-row.selected{background:var(--green-bg);border-color:var(--green-dim)}
.task-prefix{color:var(--text3);font-size:10px;flex-shrink:0}
.task-row.selected .task-prefix{color:var(--green)}
.task-name-txt{flex:1;font-size:12px;color:var(--text)}
.task-row.selected .task-name-txt{color:var(--green)}
.task-time-txt{font-size:10px;color:var(--text3);margin-right:4px}
.running-dot{font-size:9px;color:var(--green);animation:blink 1s step-end infinite;margin-right:2px}
@keyframes blink{50%{opacity:0}}
.task-actions{display:none;gap:2px}
.task-row:hover .task-actions{display:flex}
.add-task-btn{display:flex;align-items:center;gap:4px;padding:3px 8px;font-size:11px;color:var(--text3);cursor:pointer;border-radius:3px;border:1px dashed transparent;background:none;width:100%;font-family:var(--mono);margin-top:2px}
.add-task-btn:hover{color:var(--green);border-color:var(--border2)}

.inline-form{display:flex;gap:4px;padding:4px 6px}
.inline-form input{flex:1;padding:3px 7px;font-size:11px;border:1px solid var(--border2);border-radius:3px;background:var(--bg3);color:var(--text);font-family:var(--mono);outline:none}
.inline-form input:focus{border-color:var(--green-dim);color:var(--text)}
.inline-form button{padding:3px 8px;font-size:11px;border-radius:3px;cursor:pointer;border:1px solid var(--border2);background:var(--bg3);color:var(--text2);font-family:var(--mono)}
.inline-form .ok{border-color:var(--green-dim);color:var(--green)}
.inline-form .ok:hover{background:var(--green-bg)}
.empty-hint{padding:14px 8px;color:var(--text3);font-size:11px;line-height:1.8}

/* tabs */
.tabs{display:flex;background:var(--bg2);border-bottom:1px solid var(--border);flex-shrink:0}
.tab{flex:1;padding:9px 0;font-size:11px;cursor:pointer;color:var(--text3);letter-spacing:1px;text-transform:uppercase;text-align:center;border-bottom:2px solid transparent;font-family:var(--mono);transition:color 0.1s}
.tab:hover{color:var(--text2)}
.tab.active{color:var(--green);border-bottom-color:var(--green)}

/* main content */
.main-content{flex:1;overflow-y:auto;padding:16px 14px}
.main-content::-webkit-scrollbar{width:3px}
.main-content::-webkit-scrollbar-thumb{background:var(--border2);border-radius:2px}

/* timer */
.timer-context{font-size:11px;color:var(--text3);text-align:center;margin-bottom:6px;letter-spacing:0.5px;min-height:16px}
.timer-context .cat-part{color:var(--amber)}
.timer-context .task-part{color:var(--green)}
.timer-display{
  font-size:clamp(36px,10vw,52px);
  font-weight:400;letter-spacing:3px;
  color:var(--text3);
  font-variant-numeric:tabular-nums;
  text-align:center;
  line-height:1;
  margin:10px 0 16px;
  transition:color 0.3s;
}
.timer-display.running{color:var(--green);text-shadow:0 0 18px rgba(61,214,140,0.25)}
.timer-display.paused{color:var(--amber)}
.timer-btns{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.timer-btns button{
  padding:7px 16px;border-radius:3px;font-size:12px;
  cursor:pointer;border:1px solid var(--border2);
  background:var(--bg3);color:var(--text2);
  font-family:var(--mono);letter-spacing:0.5px;
  transition:all 0.1s;flex:1;min-width:80px;max-width:120px;
}
.timer-btns button:hover:not(:disabled){background:var(--bg4)}
.timer-btns button:disabled{opacity:0.3;cursor:default}
.btn-start{border-color:var(--green-dim)!important;color:var(--green)!important}
.btn-start:hover:not(:disabled){background:var(--green-bg)!important}
.btn-pause{border-color:var(--amber-dim)!important;color:var(--amber)!important}
.btn-pause:hover:not(:disabled){background:var(--amber-bg)!important}
.btn-end{border-color:var(--red-dim)!important;color:var(--red)!important}
.btn-end:hover:not(:disabled){background:var(--red-bg)!important}

.divider{height:1px;background:var(--border);margin:16px 0}
.section-hd{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:10px}
.section-hd .sec-label{font-size:10px;letter-spacing:1.5px;color:var(--text3);text-transform:uppercase}
.section-hd .sec-total{font-size:12px;color:var(--text)}

.stat-cat-block{margin-bottom:8px}
.stat-cat-row{display:flex;justify-content:space-between;align-items:baseline;padding:3px 0}
.stat-cat-name{font-size:12px;color:var(--amber)}
.stat-cat-time{font-size:12px;color:var(--text)}
.stat-task-row{display:flex;justify-content:space-between;padding:2px 0 2px 10px;border-left:1px solid var(--border)}
.stat-task-lbl{font-size:11px;color:var(--text2)}
.stat-task-lbl::before{content:'└ ';color:var(--text3)}
.stat-task-val{font-size:11px;color:var(--text2)}
.no-data{color:var(--text3);font-size:11px;padding:4px 0}

/* stats page */
.export-row{display:flex;gap:8px;margin-bottom:18px;flex-wrap:wrap}
.export-btn{
  padding:6px 12px;border-radius:3px;font-size:11px;
  cursor:pointer;border:1px solid var(--border2);
  background:var(--bg3);color:var(--text2);
  font-family:var(--mono);letter-spacing:0.5px;
  display:flex;align-items:center;gap:5px;transition:all 0.1s;
}
.export-btn:hover{border-color:var(--green-dim);color:var(--green);background:var(--green-bg)}
.auto-export-panel{width:100%;display:flex;gap:6px;align-items:center;flex-wrap:wrap;padding:6px 0 2px;color:var(--text3);font-size:10px}
.auto-export-panel label{display:flex;align-items:center;gap:4px;cursor:pointer}
.auto-export-panel input[type="checkbox"]{accent-color:var(--green)}
.auto-export-panel input[type="number"]{width:56px;background:var(--bg3);border:1px solid var(--border2);border-radius:2px;color:var(--text2);font-family:var(--mono);font-size:10px;padding:2px 5px;outline:none}
.auto-export-panel input[type="number"]:focus{border-color:var(--green-dim)}
.auto-export-status{color:var(--text3)}
.export-btn .sym{color:var(--green)}

.stats-block{margin-bottom:22px}
.stats-block-hd{
  font-size:10px;letter-spacing:1.5px;color:var(--green);
  text-transform:uppercase;margin-bottom:10px;
  padding-bottom:6px;border-bottom:1px solid var(--border);
  display:flex;justify-content:space-between;align-items:baseline;
}
.stats-block-hd .grand{color:var(--text);font-size:12px;letter-spacing:0;text-transform:none}

.stats-day{margin-bottom:14px;padding-bottom:10px;border-bottom:1px solid var(--border)}
.stats-day:last-child{border-bottom:none;margin-bottom:0}
.stats-day-hd{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:6px}
.stats-day-date{font-size:12px;color:var(--amber)}
.stats-day-total{font-size:12px;color:var(--text)}
.stats-day-del{padding:1px 6px;font-size:10px;border:1px solid transparent;border-radius:2px;background:none;color:var(--text3);cursor:pointer;font-family:var(--mono);margin-left:6px}
.stats-day-del:hover{color:var(--red);border-color:var(--red-dim)}
.sessions-toggle{display:flex;align-items:center;gap:5px;cursor:pointer;padding:3px 0;margin-top:6px;color:var(--text3);font-size:10px;letter-spacing:0.5px;user-select:none;width:fit-content}
.sessions-toggle:hover{color:var(--text2)}
.sessions-toggle-arrow{font-size:8px;transition:transform 0.15s;display:inline-block}
.sessions-toggle-arrow.open{transform:rotate(90deg)}
.sessions-list{margin-top:4px}

/* history filter */
.history-filter{display:flex;align-items:center;gap:6px;margin-bottom:10px;flex-wrap:wrap}
.filter-btn{padding:2px 10px;font-size:10px;border:1px solid var(--border2);border-radius:2px;background:none;color:var(--text3);cursor:pointer;font-family:var(--mono);letter-spacing:0.5px}
.filter-btn:hover{color:var(--text);border-color:var(--text3)}
.filter-btn.active{border-color:var(--green-dim);color:var(--green);background:var(--green-bg)}
.filter-date-inputs{display:flex;align-items:center;gap:4px}
.filter-date-input{background:var(--bg3);border:1px solid var(--border2);border-radius:2px;color:var(--text2);font-family:var(--mono);font-size:10px;padding:2px 6px;outline:none;width:96px}
.filter-date-input:focus{border-color:var(--green-dim)}
.filter-sep{font-size:10px;color:var(--text3)}
.show-more-btn{width:100%;padding:5px 0;font-size:10px;letter-spacing:0.5px;border:1px dashed var(--border2);border-radius:3px;background:none;color:var(--text3);cursor:pointer;font-family:var(--mono);margin-top:4px}
.show-more-btn:hover{color:var(--green);border-color:var(--green-dim)}

.session-row{
  display:flex;align-items:center;gap:6px;
  padding:3px 0 3px 10px;
  border-left:1px solid var(--border);
}
.session-cat{font-size:10px;color:var(--amber)}
.session-task{font-size:11px;color:var(--text2);flex:1}
.session-dur{font-size:10px;color:var(--text3);min-width:50px;text-align:right}
.session-del{padding:1px 5px;font-size:10px;border:none;border-radius:2px;background:none;color:var(--text3);cursor:pointer;font-family:var(--mono)}
.session-del:hover{color:var(--red)}
.session-dur{cursor:pointer;border-radius:2px;padding:1px 3px;}
.session-dur:hover{background:var(--bg3);color:var(--amber)}
.session-dur-input{width:64px;background:var(--bg3);border:1px solid var(--amber);border-radius:3px;color:var(--amber);font-family:var(--mono);font-size:11px;padding:1px 5px;outline:none;text-align:center}
.session-dur-ok{padding:1px 6px;font-size:10px;border:1px solid var(--green-dim);border-radius:2px;background:none;color:var(--green);cursor:pointer;font-family:var(--mono)}
.session-dur-ok:hover{background:var(--green-bg)}

/* heatmap */
.heatmap-wrap{margin-bottom:20px}
.heatmap-table{border-collapse:separate;border-spacing:3px;width:100%}
.heatmap-table th{font-size:10px;color:var(--text3);letter-spacing:0.5px;padding:3px 4px;text-align:center;font-family:var(--mono);font-weight:500}
.heatmap-table th.hm-row-label{text-align:right;padding-right:8px;color:var(--amber);font-size:10px;min-width:62px;white-space:nowrap}
.hm-cell{height:30px;border-radius:3px;text-align:center;vertical-align:middle;font-size:10px;font-family:var(--mono);font-weight:500;cursor:default}
.hm-cell.hm-empty{background:#1a2a1a;color:#2a4a2a}
.hm-legend{display:flex;align-items:center;gap:4px;margin-top:10px}
.hm-legend-box{width:22px;height:10px;border-radius:2px}
.hm-legend-lbl{font-size:10px;color:var(--text3);font-family:var(--mono)}
.hm-section-hd{font-size:10px;letter-spacing:1.5px;color:var(--green);text-transform:uppercase;margin-bottom:10px;padding-bottom:6px;border-bottom:1px solid var(--border);font-family:var(--mono)}
.hm-empty-hint{color:var(--text3);font-size:11px;padding:8px 0}
</style>
</head>
<body>
<div class="app-wrap">

  <!-- titlebar -->
  <div class="titlebar">
    <div class="dots">
      <div class="dot dot-r"></div>
      <div class="dot dot-y"></div>
      <div class="dot dot-g"></div>
    </div>
    <div class="title-text">study-tracker</div>
    <div class="clock" id="clock"></div>
  </div>

  <!-- sidebar toggle -->
  <div class="sidebar-toggle" id="sidebar-toggle">
    <div class="sidebar-toggle-left">
      <span class="sidebar-toggle-arrow open" id="sidebar-arrow">▶</span>
      <span class="sidebar-toggle-label">categories</span>
    </div>
    <button class="sidebar-add" id="addCatBtn" onclick="event.stopPropagation();">[+] add</button>
  </div>

  <!-- sidebar -->
  <div class="sidebar open" id="sidebar">
    <div class="sidebar-inner" id="sidebar-inner"></div>
  </div>

  <!-- tabs -->
  <div class="tabs">
    <div class="tab active" data-tab="timer">timer</div>
    <div class="tab" data-tab="stats">stats</div>
    <div class="tab" data-tab="heatmap">heatmap</div>
  </div>

  <!-- content -->
  <div class="main-content" id="main-content">
    <!-- timer tab -->
    <div id="tab-timer">
      <div class="timer-context" id="timer-label">select a task to start</div>
      <div class="timer-display" id="timer-display">00:00:00</div>
      <div class="timer-btns">
        <button class="btn-start" id="btn-start" disabled>▶ start</button>
        <button class="btn-pause" id="btn-pause" disabled>⏸ pause</button>
        <button class="btn-end"   id="btn-end"   disabled>■ end</button>
      </div>
      <div class="divider"></div>
      <div id="today-stats"></div>
    </div>
    <!-- stats tab -->
    <div id="tab-stats" style="display:none">
      <div id="stats-content"></div>
    </div>
    <!-- heatmap tab -->
    <div id="tab-heatmap" style="display:none">
      <div id="heatmap-content"></div>
    </div>
  </div>

</div>
<script>
(function(){
const LS='study_tracker_v2';
const AUTO_EXPORT_LS='study_tracker_auto_export_v1';
let S={categories:[],sessions:[],selectedTaskId:null,timer:{running:false,paused:false,startTs:null,accumulated:0,taskId:null}};
let autoExportSettings={enabled:false,intervalMinutes:60,lastExportAt:null};
let autoExportCheckInterval=null;
let isAutoEnding=false;

function freshTimer(){return{running:false,paused:false,startTs:null,accumulated:0,taskId:null};}
function normalizeTimer(timer){return Object.assign(freshTimer(),timer||{});}
function loadAutoExportSettings(){
  try{
    const raw=localStorage.getItem(AUTO_EXPORT_LS);
    if(raw){autoExportSettings=Object.assign(autoExportSettings,JSON.parse(raw)||{});}
  }catch(e){}
  const mins=parseInt(autoExportSettings.intervalMinutes,10);
  autoExportSettings.intervalMinutes=Number.isFinite(mins)&&mins>0?mins:60;
  autoExportSettings.enabled=!!autoExportSettings.enabled;
}
function saveAutoExportSettings(){try{localStorage.setItem(AUTO_EXPORT_LS,JSON.stringify(autoExportSettings));}catch(e){}}
function load(){
  try{
    const d=localStorage.getItem(LS);
    if(d){
      const p=JSON.parse(d);
      if(p&&p.categories){
        S.categories=p.categories;
        S.sessions=p.sessions||[];
        S.selectedTaskId=p.selectedTaskId||null;
        S.timer=normalizeTimer(p.timer);
        recoverUnfinishedTimer();
      }
    }
  }catch(e){S.timer=freshTimer();}
  loadAutoExportSettings();
  render();
  setupAutoExportChecks();
}
function save(){try{localStorage.setItem(LS,JSON.stringify({categories:S.categories,sessions:S.sessions,selectedTaskId:S.selectedTaskId,timer:S.timer}));}catch(e){}}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,6);}
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}

function fmtMs(ms){
  const s=Math.floor(ms/1000),h=Math.floor(s/3600),m=Math.floor((s%3600)/60),sec=s%60;
  if(h>0)return h+'h '+m+'m';
  if(m>0)return m+'m '+sec+'s';
  return sec+'s';
}
function fmtTimer(ms){
  const s=Math.floor(ms/1000);
  return [Math.floor(s/3600),Math.floor((s%3600)/60),s%60].map(n=>String(n).padStart(2,'0')).join(':');
}
function todayStr(){return new Date().toISOString().slice(0,10);}
function dateStrFromTs(ts){return new Date(ts||Date.now()).toISOString().slice(0,10);}
function fileStamp(){
  const d=new Date(),pad=n=>String(n).padStart(2,'0');
  return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())+'-'+pad(d.getHours())+'-'+pad(d.getMinutes());
}
function getTaskMs(taskId,dateStr){return S.sessions.filter(s=>s.taskId===taskId&&(!dateStr||s.date===dateStr)).reduce((a,s)=>a+s.durationMs,0);}
function getCatMs(catId,dateStr){const c=S.categories.find(c=>c.id===catId);return c?(c.tasks||[]).reduce((a,t)=>a+getTaskMs(t.id,dateStr),0):0;}
function totalMs(dateStr){return S.categories.reduce((a,c)=>a+getCatMs(c.id,dateStr),0);}

// timer
let timerInterval=null;
let editingSessionId=null;
let expandedSessions={};
let historyFilter={mode:'7d',from:'',to:''}; // mode: '7d'|'30d'|'all'|'custom'
function getElapsed(){
  if(S.timer.paused)return S.timer.accumulated;
  if(S.timer.running)return S.timer.accumulated+(Date.now()-S.timer.startTs);
  return S.timer.accumulated;
}
function startTimer(){
  if(!S.selectedTaskId||S.timer.running)return;
  S.timer.taskId=S.selectedTaskId;S.timer.running=true;S.timer.paused=false;S.timer.startTs=Date.now();
  timerInterval=setInterval(updateTimerDisplay,500);
  save();
  updateTimerDisplay();renderTimerBtns();renderSidebarInner();
}
function pauseTimer(){
  if(!S.timer.running)return;
  S.timer.accumulated+=Date.now()-S.timer.startTs;S.timer.running=false;S.timer.paused=true;
  clearInterval(timerInterval);save();renderTimerBtns();updateTimerDisplay();
}
function resumeTimer(){
  if(!S.timer.paused)return;
  S.timer.running=true;S.timer.paused=false;S.timer.startTs=Date.now();
  timerInterval=setInterval(updateTimerDisplay,500);save();renderTimerBtns();
}
function addSessionFromTimer(elapsed,reason,endedAt,startTs){
  if(!S.timer.taskId||elapsed<=1000)return;
  S.sessions.push({
    id:uid(),
    taskId:S.timer.taskId,
    date:dateStrFromTs(startTs||Date.now()),
    durationMs:elapsed,
    endedBy:reason||'manual',
    endedAt:endedAt||new Date().toISOString()
  });
}
function endTimer(reason='manual'){
  if(!S.timer.running&&!S.timer.paused)return;
  const startTs=S.timer.startTs||Date.now();
  const elapsed=getElapsed();
  addSessionFromTimer(elapsed,reason,new Date().toISOString(),startTs);
  S.timer=freshTimer();
  clearInterval(timerInterval);
  save();
  updateTimerDisplay();renderTimerBtns();renderTodayStats();renderSidebarInner();
}
function recoverUnfinishedTimer(){
  if(!S.timer.running&&!S.timer.paused)return;
  const now=Date.now();
  const startTs=S.timer.startTs||now;
  const elapsed=S.timer.paused?S.timer.accumulated:(S.timer.accumulated||0)+(now-startTs);
  addSessionFromTimer(elapsed,'recovered_after_reload',new Date(now).toISOString(),startTs);
  S.timer=freshTimer();
  save();
}
function safeAutoEnd(reason){
  if(isAutoEnding||(!S.timer.running&&!S.timer.paused))return;
  isAutoEnding=true;
  try{endTimer(reason);}finally{isAutoEnding=false;}
}
function updateTimerDisplay(){
  const el=document.getElementById('timer-display');if(!el)return;
  el.textContent=fmtTimer(getElapsed());
  el.className='timer-display'+(S.timer.running?' running':S.timer.paused?' paused':'');
}
function renderTimerBtns(){
  const bs=document.getElementById('btn-start'),bp=document.getElementById('btn-pause'),be=document.getElementById('btn-end');
  if(!bs)return;
  bs.disabled=!S.selectedTaskId||S.timer.running;
  bp.disabled=!S.timer.running&&!S.timer.paused;
  be.disabled=!S.timer.running&&!S.timer.paused;
  bp.textContent=S.timer.paused?'▶ resume':'⏸ pause';
}
function renderTimerLabel(){
  const el=document.getElementById('timer-label');if(!el)return;
  if(!S.selectedTaskId){el.innerHTML='select a task to start';return;}
  let cn='',tn='';
  for(const c of S.categories){const t=(c.tasks||[]).find(t=>t.id===S.selectedTaskId);if(t){cn=c.name;tn=t.name;break;}}
  el.innerHTML='<span class="cat-part">'+esc(cn)+'</span> / <span class="task-part">'+esc(tn)+'</span>';
}

// sidebar
let expandedCats={};
let addCatMode=false,addTaskCatId=null;
let sidebarOpen=true;

function renderSidebarInner(){
  const el=document.getElementById('sidebar-inner');if(!el)return;
  let html='';
  if(addCatMode){
    html+='<div class="inline-form"><input id="new-cat-input" placeholder="category name…"/><button class="ok" onclick="confirmAddCat()">ok</button><button onclick="cancelAddCat()">esc</button></div>';
  }
  for(const cat of S.categories){
    const isOpen=expandedCats[cat.id]!==false;
    const catMs=getCatMs(cat.id);
    html+='<div class="cat-block">';
    html+='<div class="cat-row" onclick="toggleCat(\''+cat.id+'\')">';
    html+='<span class="cat-chevron'+(isOpen?' open':'')+'">▶</span>';
    html+='<span class="cat-name">'+esc(cat.name)+'</span>';
    if(catMs>0)html+='<span class="cat-total">'+fmtMs(catMs)+'</span>';
    html+='<span class="cat-actions"><button class="del-btn" onclick="event.stopPropagation();deleteCat(\''+cat.id+'\')">✕</button></span>';
    html+='</div>';
    if(isOpen){
      html+='<div class="tasks-list">';
      for(const task of (cat.tasks||[])){
        if(task.archived)continue;
        const tMs=getTaskMs(task.id);
        const isSel=S.selectedTaskId===task.id;
        const isRun=S.timer.taskId===task.id&&(S.timer.running||S.timer.paused);
        html+='<div class="task-row'+(isSel?' selected':'')+'" onclick="selectTask(\''+task.id+'\')">';
        html+='<span class="task-prefix">$</span>';
        html+='<span class="task-name-txt">'+esc(task.name)+'</span>';
        if(isRun)html+='<span class="running-dot">●</span>';
        if(tMs>0)html+='<span class="task-time-txt">'+fmtMs(tMs)+'</span>';
        html+='<span class="task-actions">';
        html+='<button class="arc-btn" title="archive" onclick="event.stopPropagation();archiveTask(\''+cat.id+'\',\''+task.id+'\')">▽</button>';
        html+='<button class="del-btn" onclick="event.stopPropagation();deleteTask(\''+cat.id+'\',\''+task.id+'\')">✕</button>';
        html+='</span>';
        html+='</div>';
      }
      if(addTaskCatId===cat.id){
        html+='<div class="inline-form"><input id="new-task-input" placeholder="task name…"/><button class="ok" onclick="confirmAddTask(\''+cat.id+'\')">ok</button><button onclick="cancelAddTask()">esc</button></div>';
      } else {
        html+='<button class="add-task-btn" onclick="showAddTask(\''+cat.id+'\')">+ add task</button>';
      }
      html+='</div>';
    }
    html+='</div>';
  }
  if(!S.categories.length&&!addCatMode)html='<div class="empty-hint">$ click [+] add to create<br>your first category</div>';
  el.innerHTML=html;
  if(addCatMode){const i=document.getElementById('new-cat-input');if(i){i.focus();i.onkeydown=e=>{if(e.key==='Enter')confirmAddCat();if(e.key==='Escape')cancelAddCat();};}}
  if(addTaskCatId){const i=document.getElementById('new-task-input');if(i){i.focus();i.onkeydown=e=>{if(e.key==='Enter')confirmAddTask(addTaskCatId);if(e.key==='Escape')cancelAddTask();};}}
}

function renderTodayStats(){
  const el=document.getElementById('today-stats');if(!el)return;
  const today=todayStr();
  const todTotal=totalMs(today);
  const todStr=new Date().toLocaleDateString('en-US',{month:'short',day:'numeric'});
  let html='<div class="section-hd"><span class="sec-label">today · '+todStr+'</span><span class="sec-total">'+fmtMs(todTotal)+'</span></div>';
  let any=false;
  for(const cat of S.categories){
    const cMs=getCatMs(cat.id,today);if(!cMs)continue;any=true;
    html+='<div class="stat-cat-block"><div class="stat-cat-row"><span class="stat-cat-name">'+esc(cat.name)+'</span><span class="stat-cat-time">'+fmtMs(cMs)+'</span></div>';
    for(const t of (cat.tasks||[])){const tMs=getTaskMs(t.id,today);if(!tMs)continue;
      html+='<div class="stat-task-row"><span class="stat-task-lbl">'+esc(t.name)+'</span><span class="stat-task-val">'+fmtMs(tMs)+'</span></div>';
    }
    html+='</div>';
  }
  if(!any)html+='<div class="no-data">-- no sessions today --</div>';
  el.innerHTML=html;
}

function renderStats(){
  const el=document.getElementById('stats-content');if(!el)return;
  let html='<div class="export-row">';
  html+='<button class="export-btn" onclick="exportCSV()"><span class="sym">↓</span> export csv</button>';
  html+='<button class="export-btn" onclick="exportExcel()"><span class="sym">↓</span> export excel</button>';
  html+='<button class="export-btn" onclick="exportJSON(false)"><span class="sym">↓</span> export json</button>';
  html+='<div class="auto-export-panel">';
  html+='<label><input type="checkbox" '+(autoExportSettings.enabled?'checked':'')+' onchange="toggleAutoExport(this.checked)"> auto json</label>';
  html+='<span>every</span><input type="number" min="1" max="1440" value="'+esc(autoExportSettings.intervalMinutes)+'" onchange="setAutoExportInterval(this.value)"><span>min</span>';
  html+='<span class="auto-export-status">last: '+esc(formatAutoExportTime(autoExportSettings.lastExportAt))+'</span>';
  html+='</div>';
  html+='</div>';

  // cumulative
  const grand=totalMs();
  html+='<div class="stats-block"><div class="stats-block-hd"><span>all time</span><span class="grand">'+fmtMs(grand)+'</span></div>';
  let anyC=false;
  for(const cat of S.categories){
    const cMs=getCatMs(cat.id);if(!cMs)continue;anyC=true;
    html+='<div class="stat-cat-block"><div class="stat-cat-row"><span class="stat-cat-name">'+esc(cat.name)+'</span><span class="stat-cat-time">'+fmtMs(cMs)+'</span></div>';
    for(const t of (cat.tasks||[])){const tMs=getTaskMs(t.id);if(!tMs)continue;
      html+='<div class="stat-task-row"><span class="stat-task-lbl">'+esc(t.name)+'</span><span class="stat-task-val">'+fmtMs(tMs)+'</span></div>';
    }
    html+='</div>';
  }
  if(!anyC)html+='<div class="no-data">-- no records yet --</div>';
  html+='</div>';

  // history by day
  const allDays=[...new Set(S.sessions.map(s=>s.date))].sort((a,b)=>b.localeCompare(a));
  if(allDays.length){
    // filter logic
    const today=todayStr();
    function offsetDate(d,days){const dt=new Date(d+'T12:00:00');dt.setDate(dt.getDate()+days);return dt.toISOString().slice(0,10);}
    let filteredDays=allDays;
    const f=historyFilter;
    if(f.mode==='7d')filteredDays=allDays.filter(d=>d>=offsetDate(today,-6));
    else if(f.mode==='30d')filteredDays=allDays.filter(d=>d>=offsetDate(today,-29));
    else if(f.mode==='custom'){
      if(f.from)filteredDays=filteredDays.filter(d=>d>=f.from);
      if(f.to)filteredDays=filteredDays.filter(d=>d<=f.to);
    }

    html+='<div class="stats-block"><div class="stats-block-hd"><span>history</span></div>';

    // filter bar
    html+='<div class="history-filter">';
    ['7d','30d','all'].forEach(m=>{
      const label=m==='7d'?'last 7d':m==='30d'?'last 30d':'all time';
      html+='<button class="filter-btn'+(f.mode===m?' active':'')+'" onclick="setHistoryFilter(\''+m+'\')">'+label+'</button>';
    });
    html+='<button class="filter-btn'+(f.mode==='custom'?' active':'')+'" onclick="setHistoryFilter(\'custom\')">custom</button>';
    if(f.mode==='custom'){
      html+='<div class="filter-date-inputs">';
      html+='<input class="filter-date-input" type="date" value="'+esc(f.from)+'" onchange="setFilterFrom(this.value)" placeholder="from"/>';
      html+='<span class="filter-sep">→</span>';
      html+='<input class="filter-date-input" type="date" value="'+esc(f.to)+'" onchange="setFilterTo(this.value)" placeholder="to"/>';
      html+='</div>';
    }
    html+='</div>';

    if(!filteredDays.length){
      html+='<div class="no-data">-- no records in this range --</div>';
    } else {
      for(const day of filteredDays){
        const dayTotal=totalMs(day);
        const dayLabel=new Date(day+'T12:00:00').toLocaleDateString('en-US',{year:'numeric',month:'short',day:'numeric'});
        const daySessions=S.sessions.filter(s=>s.date===day);
        html+='<div class="stats-day">';
        html+='<div class="stats-day-hd"><span class="stats-day-date">'+dayLabel+'</span><span style="display:flex;align-items:center"><span class="stats-day-total">'+fmtMs(dayTotal)+'</span><button class="stats-day-del" onclick="deleteDay(\''+day+'\')">del day</button></span></div>';
        for(const cat of S.categories){
          const cMs=getCatMs(cat.id,day);if(!cMs)continue;
          html+='<div class="stat-cat-block"><div class="stat-cat-row"><span class="stat-cat-name" style="font-size:11px">'+esc(cat.name)+'</span><span class="stat-cat-time" style="font-size:11px">'+fmtMs(cMs)+'</span></div>';
          for(const t of (cat.tasks||[])){const tMs=getTaskMs(t.id,day);if(!tMs)continue;
            html+='<div class="stat-task-row"><span class="stat-task-lbl">'+esc(t.name)+'</span><span class="stat-task-val">'+fmtMs(tMs)+'</span></div>';
          }
          html+='</div>';
        }
        const isOpen=expandedSessions[day];
        html+='<div class="sessions-toggle" onclick="toggleSessions(\''+day+'\')">';
        html+='<span class="sessions-toggle-arrow'+(isOpen?' open':'')+'">▶</span>';
        html+='<span>sessions ('+daySessions.length+')</span>';
        html+='</div>';
        if(isOpen){
          html+='<div class="sessions-list">';
          for(const sess of daySessions){
            let cn='',tn='';
            for(const c of S.categories){const t=(c.tasks||[]).find(t=>t.id===sess.taskId);if(t){cn=c.name;tn=t.name;break;}}
            const isEditing=editingSessionId===sess.id;
            html+='<div class="session-row" id="sess-'+sess.id+'">';
            html+='<span class="session-cat">'+esc(cn)+'</span>';
            html+='<span class="session-task">'+esc(tn)+'</span>';
            if(isEditing){
              const curMins=Math.round(sess.durationMs/60000);
              html+='<input class="session-dur-input" id="sess-input-'+sess.id+'" value="'+curMins+'" type="number" min="1" max="9999" title="minutes"/>';
              html+='<span style="font-size:10px;color:var(--text3);margin:0 2px">m</span>';
              html+='<button class="session-dur-ok" onclick="confirmEditSession(\''+sess.id+'\')">ok</button>';
              html+='<button class="session-del" onclick="cancelEditSession()">esc</button>';
            } else {
              html+='<span class="session-dur" title="click to edit" onclick="startEditSession(\''+sess.id+'\')">'+fmtMs(sess.durationMs)+'</span>';
              html+='<button class="session-del" onclick="deleteSession(\''+sess.id+'\')">✕</button>';
            }
            html+='</div>';
          }
          html+='</div>';
        }
        html+='</div>';
      }
    }
    html+='</div>';
  }
  el.innerHTML=html;
}

function render(){
  renderSidebarInner();renderTimerLabel();renderTimerBtns();updateTimerDisplay();renderTodayStats();
  const st=document.getElementById('tab-stats');
  if(st&&st.style.display!=='none')renderStats();
}

// actions
window.toggleCat=function(id){expandedCats[id]=expandedCats[id]===false?true:false;renderSidebarInner();};
window.selectTask=function(id){
  S.selectedTaskId=id;
  if((S.timer.running||S.timer.paused)&&S.timer.taskId!==id)endTimer('task_switched');
  S.timer.accumulated=0;S.timer.startTs=null;
  save();
  renderSidebarInner();renderTimerLabel();renderTimerBtns();updateTimerDisplay();
};
window.deleteCat=function(id){
  if(!confirm('Delete this category and all its tasks?'))return;
  S.categories=S.categories.filter(c=>c.id!==id);
  if(S.selectedTaskId&&!S.categories.some(c=>(c.tasks||[]).some(t=>t.id===S.selectedTaskId)))S.selectedTaskId=null;
  save();render();
};
window.deleteTask=function(catId,taskId){
  const cat=S.categories.find(c=>c.id===catId);
  if(cat)cat.tasks=(cat.tasks||[]).filter(t=>t.id!==taskId);
  if(S.selectedTaskId===taskId)S.selectedTaskId=null;
  save();render();
};
window.archiveTask=function(catId,taskId){
  const cat=S.categories.find(c=>c.id===catId);
  if(!cat)return;
  const task=(cat.tasks||[]).find(t=>t.id===taskId);
  if(!task)return;
  task.archived=true;
  if(S.selectedTaskId===taskId){
    S.selectedTaskId=null;
    if(S.timer.running||S.timer.paused)endTimer('task_archived');
  }
  save();render();
};
window.toggleSessions=function(day){expandedSessions[day]=!expandedSessions[day];renderStats();};
window.setHistoryFilter=function(mode){historyFilter.mode=mode;if(mode!=='custom'){historyFilter.from='';historyFilter.to='';}renderStats();};
window.setFilterFrom=function(v){historyFilter.from=v;renderStats();};
window.setFilterTo=function(v){historyFilter.to=v;renderStats();};
window.deleteSession=function(id){
  S.sessions=S.sessions.filter(s=>s.id!==id);
  save();renderStats();renderTodayStats();renderSidebarInner();
};
window.startEditSession=function(id){
  editingSessionId=id;
  renderStats();
  const input=document.getElementById('sess-input-'+id);
  if(input){input.focus();input.select();
    input.onkeydown=e=>{if(e.key==='Enter')confirmEditSession(id);if(e.key==='Escape')cancelEditSession();};
  }
};
window.cancelEditSession=function(){editingSessionId=null;renderStats();};
window.confirmEditSession=function(id){
  const input=document.getElementById('sess-input-'+id);
  if(!input)return;
  const mins=parseFloat(input.value);
  if(isNaN(mins)||mins<=0){input.focus();return;}
  const sess=S.sessions.find(s=>s.id===id);
  if(sess)sess.durationMs=Math.round(mins*60000);
  editingSessionId=null;
  save();renderStats();renderTodayStats();renderSidebarInner();
};
window.deleteDay=function(dateStr){
  if(!confirm('Delete all sessions for this day?'))return;
  S.sessions=S.sessions.filter(s=>s.date!==dateStr);
  save();renderStats();renderTodayStats();renderSidebarInner();
};
window.showAddTask=function(id){addTaskCatId=id;renderSidebarInner();};
window.cancelAddTask=function(){addTaskCatId=null;renderSidebarInner();};
window.confirmAddTask=function(catId){
  const i=document.getElementById('new-task-input');if(!i||!i.value.trim())return;
  const cat=S.categories.find(c=>c.id===catId);if(!cat)return;
  if(!cat.tasks)cat.tasks=[];
  cat.tasks.push({id:uid(),name:i.value.trim()});
  addTaskCatId=null;save();render();
};
window.cancelAddCat=function(){addCatMode=false;renderSidebarInner();};
window.confirmAddCat=function(){
  const i=document.getElementById('new-cat-input');if(!i||!i.value.trim())return;
  const cat={id:uid(),name:i.value.trim(),tasks:[]};
  S.categories.push(cat);expandedCats[cat.id]=true;
  addCatMode=false;save();render();
};

// heatmap
function renderHeatmap(){
  const el=document.getElementById('heatmap-content');if(!el)return;
  if(!S.sessions.length){el.innerHTML='<div class="hm-empty-hint">-- no records yet --</div>';return;}

  // 收集所有日期與類別
  const dateSet=new Set(),catMap={};
  for(const s of S.sessions){
    dateSet.add(s.date);
    for(const c of S.categories){
      if((c.tasks||[]).some(t=>t.id===s.taskId))catMap[s.taskId]=c.name;
    }
  }
  const dates=[...dateSet].sort();
  const catNames=[...new Set(S.categories.map(c=>c.name))];

  // 建立 lookup: catName|date => ms
  const lookup={};
  for(const s of S.sessions){
    const cn=catMap[s.taskId];if(!cn)continue;
    const key=cn+'|'+s.date;
    lookup[key]=(lookup[key]||0)+s.durationMs;
  }
  const allVals=Object.values(lookup);
  if(!allVals.length){el.innerHTML='<div class="hm-empty-hint">-- no records yet --</div>';return;}
  const maxVal=Math.max(...allVals);

  // 綠色終端漸層
  const GREEN_STOPS=['#0d2e1a','#1a5c31','#27913f','#2db84f','#39ff8a'];
  const GREEN_FGS  =['#39ff8a','#39ff8a','#0d2e1a','#0d2e1a','#0d2e1a'];

  function lerpHex(a,b,t){
    const p=s=>[parseInt(s.slice(1,3),16),parseInt(s.slice(3,5),16),parseInt(s.slice(5,7),16)];
    const [ar,ag,ab]=p(a),[br,bg2,bb2]=p(b);
    return '#'+[Math.round(ar+(br-ar)*t),Math.round(ag+(bg2-ag)*t),Math.round(ab+(bb2-ab)*t)].map(x=>x.toString(16).padStart(2,'0')).join('');
  }
  function getColor(val){
    const t=Math.min(val/maxVal,1);
    const n=GREEN_STOPS.length-1;
    const idx=Math.min(Math.floor(t*n),n-1);
    const lt=(t-idx/n)*n;
    return{bg:lerpHex(GREEN_STOPS[idx],GREEN_STOPS[idx+1],lt),fg:GREEN_FGS[Math.round(t*(GREEN_FGS.length-1))]};
  }

  // 格式化日期 label
  function fmtDate(d){const dt=new Date(d+'T12:00:00');return (dt.getMonth()+1)+'/'+(dt.getDate());}

  let html='<div class="hm-section-hd">heatmap · minutes</div>';
  html+='<div class="heatmap-wrap"><table class="heatmap-table">';

  // header row: 日期
  html+='<tr><th class="hm-row-label"></th>';
  for(const d of dates)html+='<th>'+fmtDate(d)+'</th>';
  html+='<th style="color:var(--text3);font-size:10px">sum</th></tr>';

  // data rows: 類別
  for(const cat of catNames){
    html+='<tr><th class="hm-row-label">'+esc(cat)+'</th>';
    let rowTotal=0;
    for(const d of dates){
      const val=lookup[cat+'|'+d]||0;
      if(val){
        const mins=Math.round(val/60000);
        rowTotal+=mins;
        const{bg,fg}=getColor(val);
        html+='<td class="hm-cell" style="background:'+bg+';color:'+fg+'" title="'+esc(cat)+' · '+fmtDate(d)+' · '+mins+'m">'+mins+'m</td>';
      } else {
        html+='<td class="hm-cell hm-empty">–</td>';
      }
    }
    html+='<td class="hm-cell" style="background:none;color:var(--text3);font-size:10px">'+(rowTotal?rowTotal+'m':'')+'</td>';
    html+='</tr>';
  }

  // sum row
  html+='<tr><th class="hm-row-label" style="color:var(--text3)">sum</th>';
  let grandTotal=0;
  for(const d of dates){
    let dayTotal=0;
    for(const cat of catNames)dayTotal+=Math.round((lookup[cat+'|'+d]||0)/60000);
    grandTotal+=dayTotal;
    html+='<td class="hm-cell" style="background:none;color:var(--text3);font-size:10px">'+(dayTotal?dayTotal+'m':'')+'</td>';
  }
  html+='<td class="hm-cell" style="background:none;color:var(--green);font-size:10px;font-weight:500">'+grandTotal+'m</td>';
  html+='</tr>';

  html+='</table>';

  // legend
  html+='<div class="hm-legend"><span class="hm-legend-lbl">少</span>';
  [0.1,0.3,0.5,0.75,1].forEach(t=>{
    const{bg}=getColor(t*maxVal);
    html+='<div class="hm-legend-box" style="background:'+bg+'"></div>';
  });
  html+='<span class="hm-legend-lbl">多</span></div>';
  html+='</div>';

  el.innerHTML=html;
}

// export
function buildRows(){
  const rows=[['Date','Category','Task','Duration (min)']];
  for(const s of S.sessions){
    let cn='',tn='';
    for(const c of S.categories){const t=(c.tasks||[]).find(t=>t.id===s.taskId);if(t){cn=c.name;tn=t.name;break;}}
    rows.push([s.date,cn,tn,Math.round(s.durationMs/60000)]);
  }
  return rows;
}
function buildExportPayload(){
  const dates=S.sessions.map(s=>s.date).filter(Boolean).sort();
  return{
    version:2,
    exportedAt:new Date().toISOString(),
    categories:S.categories,
    sessions:S.sessions,
    summary:{
      totalDurationMs:S.sessions.reduce((a,s)=>a+(s.durationMs||0),0),
      totalSessions:S.sessions.length,
      dateRange:{from:dates.length?dates[0]:null,to:dates.length?dates[dates.length-1]:null}
    }
  };
}
function downloadJSONPayload(payload){
  const json=JSON.stringify(payload,null,2);
  const blob=new Blob([json],{type:'application/json;charset=utf-8'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');
  a.href=url;a.download='study-tracker-'+fileStamp()+'.json';a.click();
  URL.revokeObjectURL(url);
}
window.exportJSON=function(isAuto=false){
  downloadJSONPayload(buildExportPayload());
  if(isAuto){
    autoExportSettings.lastExportAt=Date.now();
    saveAutoExportSettings();
    const st=document.getElementById('tab-stats');
    if(st&&st.style.display!=='none')renderStats();
  }
};
function shouldAutoExport(){
  if(!autoExportSettings.enabled)return false;
  const last=parseInt(autoExportSettings.lastExportAt||0,10);
  const intervalMs=Math.max(1,parseInt(autoExportSettings.intervalMinutes,10)||60)*60000;
  return !last||Date.now()-last>=intervalMs;
}
function checkAutoExport(){if(shouldAutoExport())window.exportJSON(true);}
function setupAutoExportChecks(){
  if(autoExportCheckInterval)clearInterval(autoExportCheckInterval);
  autoExportCheckInterval=setInterval(checkAutoExport,60000);
  setTimeout(checkAutoExport,0);
}
function formatAutoExportTime(ts){
  if(!ts)return 'never';
  try{return new Date(parseInt(ts,10)).toLocaleString('en-GB',{month:'short',day:'2-digit',hour:'2-digit',minute:'2-digit'});}catch(e){return 'never';}
}
window.toggleAutoExport=function(enabled){
  autoExportSettings.enabled=!!enabled;
  if(enabled&&!autoExportSettings.lastExportAt)autoExportSettings.lastExportAt=Date.now();
  saveAutoExportSettings();
  setupAutoExportChecks();
  renderStats();
};
window.setAutoExportInterval=function(v){
  const mins=parseInt(v,10);
  autoExportSettings.intervalMinutes=Number.isFinite(mins)&&mins>0?mins:60;
  saveAutoExportSettings();
  setupAutoExportChecks();
  renderStats();
};
window.exportCSV=function(){
  const rows=buildRows();
  const csv=rows.map(r=>r.map(v=>'"'+String(v).replace(/"/g,'""')+'"').join(',')).join('\n');
  const blob=new Blob(['\uFEFF'+csv],{type:'text/csv;charset=utf-8'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');a.href=url;a.download='study-records.csv';a.click();
  URL.revokeObjectURL(url);
};
window.exportExcel=async function(){
  if(typeof ExcelJS==='undefined'){alert('ExcelJS not loaded yet, please try again in a moment.');return;}

  const wb=new ExcelJS.Workbook();
  wb.creator='study-tracker';

  // helpers
  function lerpChannel(a,b,t){return Math.round(a+(b-a)*t);}
  function hexToRgb(h){return[parseInt(h.slice(0,2),16),parseInt(h.slice(2,4),16),parseInt(h.slice(4,6),16)];}
  function lerpColor(stops,t){
    const n=stops.length-1,idx=Math.min(Math.floor(t*n),n-1),lt=(t-idx/n)*n;
    const[ar,ag,ab]=hexToRgb(stops[idx]),[br,bg2,bb]=hexToRgb(stops[idx+1]);
    return[lerpChannel(ar,br,lt),lerpChannel(ag,bg2,lt),lerpChannel(ab,bb,lt)]
      .map(x=>x.toString(16).padStart(2,'0')).join('').toUpperCase();
  }
  function argb(hex6){return 'FF'+hex6.toUpperCase();}
  function cellFill(hex6){return{type:'pattern',pattern:'solid',fgColor:{argb:argb(hex6)}};}
  function cellFont(hex6,bold=false){return{color:{argb:argb(hex6)},bold,name:'Consolas',size:10};}
  function fmtDate(d){const dt=new Date(d+'T12:00:00');return(dt.getMonth()+1)+'/'+(dt.getDate());}

  // ── Sheet 1: Data ──────────────────────────────────────────
  const ws1=wb.addWorksheet('Data');
  ws1.columns=[
    {header:'Date',key:'date',width:14},
    {header:'Category',key:'cat',width:16},
    {header:'Task',key:'task',width:30},
    {header:'Duration (min)',key:'dur',width:16},
  ];
  // header style
  ws1.getRow(1).eachCell(cell=>{
    cell.fill=cellFill('161B22');
    cell.font=cellFont('3DD68C',true);
    cell.alignment={horizontal:'center'};
  });
  // data rows
  const dataRows=buildRows().slice(1);
  dataRows.forEach(r=>{
    const row=ws1.addRow(r);
    row.eachCell(cell=>{
      cell.font={name:'Consolas',size:10};
    });
  });

  // ── Sheet 2: Heatmap ───────────────────────────────────────
  const catMap={};
  for(const s of S.sessions)
    for(const c of S.categories)
      if((c.tasks||[]).some(t=>t.id===s.taskId))catMap[s.taskId]=c.name;

  const dateSet=new Set();
  for(const s of S.sessions)dateSet.add(s.date);
  const dates=[...dateSet].sort();
  const catNames=[...new Set(S.categories.map(c=>c.name))];

  const lookup={};
  for(const s of S.sessions){
    const cn=catMap[s.taskId];if(!cn)continue;
    const key=cn+'|'+s.date;
    lookup[key]=(lookup[key]||0)+s.durationMs;
  }
  const allMs=Object.values(lookup);
  const maxMs=allMs.length?Math.max(...allMs):1;

  const G_STOPS=['0D2E1A','1A5C31','27913F','2DB84F','39FF8A'];
  const G_FGS   =['39FF8A','39FF8A','0D2E1A','0D2E1A','0D2E1A'];

  const ws2=wb.addWorksheet('Heatmap');

  // column widths
  ws2.getColumn(1).width=14;
  for(let i=0;i<dates.length;i++)ws2.getColumn(i+2).width=8;
  ws2.getColumn(dates.length+2).width=8;

  // header row
  const hdrRow=ws2.addRow(['Category',...dates.map(fmtDate),'Sum']);
  hdrRow.eachCell(cell=>{
    cell.fill=cellFill('161B22');
    cell.font=cellFont('3DD68C',true);
    cell.alignment={horizontal:'center'};
  });
  hdrRow.getCell(1).alignment={horizontal:'left'};

  // data rows
  const colSums=new Array(dates.length).fill(0);
  catNames.forEach(cat=>{
    const rowData=[cat];
    let rowSum=0;
    for(let di=0;di<dates.length;di++){
      const ms=lookup[cat+'|'+dates[di]]||0;
      const mins=Math.round(ms/60000);
      rowData.push(mins||null);
      rowSum+=mins;
      colSums[di]+=mins;
    }
    rowData.push(rowSum||null);
    const row=ws2.addRow(rowData);

    // cat label cell
    row.getCell(1).fill=cellFill('161B22');
    row.getCell(1).font=cellFont('F0B429',true);
    row.getCell(1).alignment={horizontal:'left'};

    // data cells
    for(let di=0;di<dates.length;di++){
      const ms=lookup[cat+'|'+dates[di]]||0;
      const cell=row.getCell(di+2);
      cell.alignment={horizontal:'center'};
      if(ms>0){
        const t=Math.min(ms/maxMs,1);
        cell.fill=cellFill(lerpColor(G_STOPS,t));
        cell.font=cellFont(lerpColor(G_FGS,t));
      } else {
        cell.fill=cellFill('1A2A1A');
        cell.font=cellFont('2A4A2A');
      }
    }

    // row sum cell
    const sumCell=row.getCell(dates.length+2);
    sumCell.fill=cellFill('161B22');
    sumCell.font=cellFont('607080',true);
    sumCell.alignment={horizontal:'center'};
  });

  // sum row
  const sumRowData=['Sum',...colSums.map(v=>v||null),colSums.reduce((a,b)=>a+b,0)];
  const sumRow=ws2.addRow(sumRowData);
  sumRow.eachCell(cell=>{
    cell.fill=cellFill('161B22');
    cell.font=cellFont('3DD68C',true);
    cell.alignment={horizontal:'center'};
  });
  sumRow.getCell(1).alignment={horizontal:'left'};

  // download
  const buf=await wb.xlsx.writeBuffer();
  const blob=new Blob([buf],{type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');a.href=url;a.download='study-records.xlsx';a.click();
  URL.revokeObjectURL(url);
};

load();
})();
